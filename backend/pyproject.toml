[project]
name = "upboard-backend"
version = "1.0.0"
description = "UP Board API — FastAPI + PostgreSQL (ADR-001)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF001", # Thai text in strings is intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "E501"]
"../database/**" = ["E501", "E402", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:pythainlp.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/core/storage.py:S3Storage*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
