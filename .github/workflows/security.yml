name: Security Scan

on:
  push:
    branches: [ main, dev, 'feat/**', 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks CLI
        run: docker run --rm -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source="/path" --verbose