# .github/workflows/ci.yml — Lint + Test + Build ทุก Pull Request
name: CI

on:                              # ทำงานเมื่อไหร่
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:                            # งานที่ต้องทำ (รันขนานกัน)
  lint:                          # งานที่ 1: ตรวจรูปแบบโค้ด JS เดิม (lab) ด้วย ESLint
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .

  test:                          # งานที่ 2: เทสต์ JS เดิม (lab) + บังคับ coverage ขั้นต่ำ
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test --experimental-test-coverage --test-coverage-lines=60 src/tests/*.test.js

  backend:                       # งานที่ 3: FastAPI — ruff + Alembic (up/down/check) + pytest บน PostgreSQL จริง
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: upboard
          POSTGRES_PASSWORD: upboard_ci_pw
          POSTGRES_DB: upboard_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U upboard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://upboard:upboard_ci_pw@localhost:5432/upboard_test
      TEST_DATABASE_URL: postgresql+psycopg://upboard:upboard_ci_pw@localhost:5432/upboard_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests ../database && ruff format --check app tests ../database
      - name: Migrations upgrade → downgrade → upgrade, and models match
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Tests (unit, RBAC, API, database, expiration, moderation)
        run: pytest --cov=app --cov-report=term --cov-fail-under=80

  frontend:                      # งานที่ 4: Next.js — lint + typecheck + unit tests + build
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:                           # งานที่ 5: E2E — mock (Playwright + axe) และระบบจริงผ่าน docker compose
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    needs: [ backend, frontend ]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate throw-away secrets for the CI stack
        run: |
          {
            echo "POSTGRES_USER=upboard"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=upboard"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "BOOTSTRAP_ADMIN_EMAIL=admin@up.ac.th"
            echo "BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "DEMO_PASSWORD=Demo-$(openssl rand -hex 6)"
            # the real-stack suite registers fresh students and posts quickly with demo accounts
            echo "PASSWORD_SIGNUP_ENABLED=true"
            echo "SPAM_POLICY_ENABLED=false"
          } > "$RUNNER_TEMP/ci.env"
      - name: Start the full stack
        run: docker compose -p upboard-ci --env-file "$RUNNER_TEMP/ci.env" up -d --build --wait --wait-timeout 300
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E with mocked API (desktop + mobile, axe)
        run: npm run test:e2e
        working-directory: frontend
      - name: E2E against the real stack (frontend → API → PostgreSQL)
        working-directory: frontend
        run: |
          set -a; . "$RUNNER_TEMP/ci.env"; set +a
          E2E_DEMO_PASSWORD="$DEMO_PASSWORD" E2E_ADMIN_PASSWORD="$BOOTSTRAP_ADMIN_PASSWORD" \
          E2E_COMPOSE_PROJECT=upboard-ci E2E_COMPOSE_ENV_FILE="$RUNNER_TEMP/ci.env" \
          npm run test:e2e:real
      - name: Stack logs on failure
        if: failure()
        run: docker compose -p upboard-ci --env-file "$RUNNER_TEMP/ci.env" logs --no-color | tail -300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  build:                         # งานที่ 6: ตรวจว่าสร้าง Docker image ได้ (backend + frontend)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t up-board-api:ci .
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1 -t up-board-web:ci frontend
