# CD: Frontend → Vercel (Git integration), Backend API → Render Free.
# Run migrations here because Render Free does not support pre-deploy commands.
name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI"]          # ต้องตรงกับ name: ใน .github/workflows/ci.yml
    types: [completed]
    branches: [main]           # deploy เฉพาะโค้ดที่อยู่บน main แล้ว

permissions:
  contents: read

jobs:
  deploy-backend:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check required production secrets
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          ADMIN_EMAIL: ${{ secrets.PRODUCTION_BOOTSTRAP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.PRODUCTION_BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$API_HOOK" ] || [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::Configure the production database, bootstrap admin, and Render API deploy secrets."
            exit 1
          fi

      - name: Check out the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run production migrations and seed
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.PRODUCTION_BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_BOOTSTRAP_ADMIN_PASSWORD }}
          ENVIRONMENT: production
        run: |
          export JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python -m alembic upgrade head
          python ../database/seeders/seed.py

      - name: Trigger Render API deploy for the commit CI tested
        env:
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          curl --fail --silent --show-error -X POST "${API_HOOK}&ref=${SHA}"
